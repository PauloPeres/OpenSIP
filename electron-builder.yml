appId: com.opensip.app
productName: OpenSIP
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  output: dist
files:
  - out/**
  - package.json
publish:
  provider: github
  owner: PauloPeres
  repo: OpenSIP
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
