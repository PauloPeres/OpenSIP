appId: com.opensip.app
productName: Open SIP Phone
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  output: dist
files:
  - out/**
  - package.json
publish:
  provider: github
  owner: PauloPeres
  repo: OpenSIP
  # Never published by the build: the owner reviews the draft and publishes it by hand (docs/releasing.md).
  releaseType: draft
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  # Ad-hoc signs when no Developer ID cert exists; see build/adhoc-sign.cjs and docs/packaging.md
  sign: build/adhoc-sign.cjs
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Open SIP Phone uses the microphone so the other person can hear you during calls.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  icon: build/icon.png
  # .deb requires a maintainer and package.json's author has no email.
  maintainer: Open SIP Phone Contributors <noreply@github.com>
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
