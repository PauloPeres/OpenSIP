name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run these same gates instead of repeating them.
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: i18n gate
        run: npm run gate:i18n
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: BDD
        run: npm run test:bdd
      - name: CRAP gate
        run: npm run gate:crap
      - name: Duplication gate
        run: npm run gate:dry
      - name: Mutation tests
        if: matrix.node-version == 22
        run: npm run gate:mutation

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
