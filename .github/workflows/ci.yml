name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run these same gates instead of repeating them.
  workflow_call:
    inputs:
      # release.yml passes false: it packages every platform itself, so the plain Vite
      # build here would only occupy a second macOS runner for work it repeats.
      # Pushes and pull requests have no inputs, so the build job treats "unset" as true.
      package:
        description: Also run the cross-platform build job
        type: boolean
        default: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # ~14 min on Node 22 (mutation testing); ~2x headroom
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: i18n gate
        run: npm run gate:i18n
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: BDD
        run: npm run test:bdd
      - name: CRAP gate
        run: npm run gate:crap
      - name: Duplication gate
        run: npm run gate:dry
      - name: Mutation tests
        if: matrix.node-version == 22
        run: npm run gate:mutation

  build:
    needs: quality
    # `inputs` is empty on push/pull_request, so compare the stringified value: null
    # becomes '' (build), true 'true' (build), false 'false' (skip). A bare
    # `inputs.package != false` would wrongly skip, because null == false in expressions.
    if: ${{ format('{0}', inputs.package) != 'false' }}
    timeout-minutes: 20 # Vite bundle: ~1 min on the slowest OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
